name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repo (+ fetch public deps).
permissions:
  contents: read

jobs:
  build-test:
    name: bgfx backend build + test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The shared SDL desktop gamepad source (labelle-sdl-gamepad) links SDL2.
      - name: Install SDL2
        run: brew install sdl2
      # zbgfx C/C++ is heavy; cache the global + project zig caches keyed on the zon.
      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
            .zig-cache
          key: bgfx-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            bgfx-${{ runner.os }}-
      - name: Build + test
        run: zig build test
      # Material seam golden (labelle-gfx#305, RFC §6): render the fixed scene
      # covering the full curated set — flash + palette_swap + dissolve + outline
      # — surfaceless (Metal offscreen FB — the macos-latest Apple-Silicon runner
      # has a Metal device + a GUI session) and diff it against the committed
      # golden TGA. Regenerate with `zig build material-golden-bless` after an
      # intentional shader change.
      - name: Material golden (flash + palette_swap + dissolve + outline)
        run: zig build material-golden
      # Post-fx seam golden (labelle-gfx#305 P2 Slice B, RFC §2.4 / §6): render the
      # fixed scene, run a bloom→crt stack through applyPostPass (render-target
      # ping-pong), composite onto the primary, and diff the surfaceless capture
      # against the committed golden TGA. Regenerate with
      # `zig build post-fx-golden-bless` after an intentional shader change.
      - name: Post-fx golden (bloom + crt)
        run: zig build post-fx-golden
      # Post-fx INTEGRATION golden (gfx×bgfx, labelle-gfx#305 P2): drive the REAL
      # gfx PostFxDriver (its two-buffer ping-pong composition — the exact logic
      # the engine runs) over THIS bgfx backend, surfaceless. This is the proof the
      # direct-drive post-fx-golden above cannot give: it exercises the driver's
      # submission-vs-execution ordering. Variant 2 (EVEN bloom→crt) is the bug
      # case — before the transient-view fix it read target_b before bloom wrote it.
      # The odd 1-pass + 3-pass variants guard against regression. Regenerate the
      # odd-length goldens with the matching `-bless` steps after a shader change.
      - name: Post-fx integration golden (real gfx driver, bloom→crt)
        run: zig build post-fx-integration-golden
      - name: Post-fx integration golden (real gfx driver, 1-pass, no-regression)
        run: zig build post-fx-integration-golden-single
      - name: Post-fx integration golden (real gfx driver, 3-pass, no-regression)
        run: zig build post-fx-integration-golden-triple

  # Integration: generate + cross-build the bgfx-android example (which now lives
  # here, not in labelle-assembler). Verifies the backend works end-to-end through
  # the toolkit. The example pins released core/engine/gfx (fetched) + this repo as
  # its backend (local:../..) + the assembler/cli as siblings (the flip + the
  # externalUsesEnumPath fix are unreleased, so build them from main). Build-only —
  # produces the aarch64 NativeActivity libgame.so; no device/emulator/APK.
  android-example:
    name: bgfx-android example .so cross-build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # ── Toolchain pins (labelle-bgfx#79) ────────────────────────────────
    # These two tags are the single source of truth for the toolchain this
    # job builds from source. They were floating `ref: main`, which broke
    # every PR: `zig build` in labelle-cli takes its version string from
    # build.zig.zon, and that field has been frozen at 1.55.1 for many
    # releases — only labelle-cli's release workflow stamps the real number
    # via `-Dversion=<tag>`. So a from-source CLI built off main (v1.61.2
    # CODE) introduced itself as v1.55.1, the examples' labelle.lock says
    # it was written by a newer CLI, and the CLI's stale-binary guard
    # (labelle-cli#353) correctly refused to build.
    #
    # The guard is right; the version the binary reported was the lie. So:
    # check the CLI out at a TAG and stamp that tag with `-Dversion` — the
    # same thing labelle-cli's own release.yml does — and the binary
    # reports what it actually is. NEVER LABELLE_ALLOW_OLDER_CLI=1: that
    # silences a guard that exists to stop a stale CLI silently mis-building
    # a newer project (skipped unknown fields -> mangled atlases).
    #
    # Invariant, enforced by the preflight step below: the CLI this job
    # builds is never older than the labelle.lock of any example in this
    # repo. Bump LABELLE_CLI_TAG and the examples' locks together (run
    # `labelle generate` with the new CLI, commit the lock).
    #
    # LABELLE_ASSEMBLER_TAG is the assembler release the pinned CLI pairs
    # with (src/cli/assembler.zig DEFAULT_ASSEMBLER_VERSION at that tag) —
    # pinned for the same reason, so this job is reproducible rather than
    # dependent on whatever landed on someone else's main this morning.
    env:
      LABELLE_CLI_TAG: v1.61.2
      LABELLE_ASSEMBLER_TAG: v0.99.1
    steps:
      - name: Checkout labelle-bgfx
        uses: actions/checkout@v4
        with:
          path: labelle-bgfx
          persist-credentials: false

      # Fail in seconds, with an actionable message, rather than 20 minutes
      # in with the CLI's guard message — and cover EVERY example's lock,
      # including the two this job does not build, so the skew cannot land
      # on main unnoticed and surface later.
      - name: Preflight — pinned CLI is not older than any example lock
        run: |
          set -euo pipefail
          pin="${LABELLE_CLI_TAG#v}"
          echo "pinned labelle-cli: $pin ($LABELLE_CLI_TAG)"
          skew=0
          bad=0
          seen=0
          for lock in labelle-bgfx/examples/*/labelle.lock; do
            # An unmatched glob leaves the literal pattern here, and a lock
            # can be unreadable. Say so ourselves instead of letting a tool's
            # own error status abort the job with no explanation.
            if [ ! -f "$lock" ] || [ ! -r "$lock" ]; then
              echo "  BAD   $lock is not a readable file"
              bad=1
              continue
            fi
            seen=$((seen + 1))
            # First non-comment .cli_version — the top-level one in any lock
            # labelle-cli wrote (it stamps that field before .resolved).
            #
            # One awk, deliberately not `grep | sed | head`: awk stops at the
            # first match by itself, so there is no `head` closing the pipe
            # early (SIGPIPE) on a lock with many .cli_version lines, and no
            # `grep` exit-1 on a comment-only or empty lock. Either of those
            # would trip `pipefail` and abort the job *before* the empty and
            # malformed handling below — losing the actionable message that
            # is this whole step's reason to exist.
            lockv=$(awk -F'"' '
              /^[ \t]*\/\// { next }
              /^[ \t]*\.cli_version[ \t]*=[ \t]*"[^"]*"/ { print $2; exit }
            ' "$lock")
            if [ -z "$lockv" ]; then
              echo "  skip  $lock (no cli_version)"
              continue
            fi
            # Guard the version compare: `sort -V` will happily order junk,
            # which would report a bogus skew instead of a bogus lock.
            case "$lockv" in
              ''|*[!0-9.]*|.*|*.|*..*)
                echo "  BAD   $lock  cli_version \"$lockv\" is not a version number"
                bad=1
                continue
                ;;
            esac
            if [ "$lockv" = "$pin" ]; then
              echo "  ok    $lock  lock $lockv == pin $pin"
            elif [ "$(printf '%s\n%s\n' "$pin" "$lockv" | sort -V | tail -1)" = "$pin" ]; then
              echo "  ok    $lock  lock $lockv <  pin $pin"
            else
              echo "  FAIL  $lock  lock $lockv >  pin $pin"
              skew=1
            fi
          done
          if [ "$seen" -eq 0 ]; then
            echo
            echo "The preflight examined no labelle.lock at all — labelle-bgfx/examples/*/labelle.lock"
            echo "matched nothing. A preflight that silently covers zero locks is worse than none."
            echo "Fix: check the checkout path and that examples/*/labelle.lock are committed."
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo
            echo "An example's labelle.lock could not be read, or its .cli_version is not a"
            echo "version number. Locks are written by labelle-cli — a lock that does not"
            echo "parse means it was hand-edited or truncated."
            echo "Fix: re-run \`labelle generate\` in that example with the pinned CLI and"
            echo "     commit the regenerated lock."
            exit 1
          fi
          if [ "$skew" -ne 0 ]; then
            echo
            echo "An example's labelle.lock was written by a labelle-cli NEWER than the one"
            echo "this job pins. An older CLI can silently mis-build a newer project, so the"
            echo "CLI would refuse (labelle-cli#353) — correctly."
            echo "Fix: raise LABELLE_CLI_TAG in .github/workflows/ci.yml to a release >= the"
            echo "     lock version above, and keep the two in step from now on."
            echo "Do NOT set LABELLE_ALLOW_OLDER_CLI=1."
            exit 1
          fi

      - name: Checkout labelle-assembler (${{ env.LABELLE_ASSEMBLER_TAG }})
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: ${{ env.LABELLE_ASSEMBLER_TAG }}
          path: labelle-assembler
          persist-credentials: false

      - name: Checkout labelle-cli (${{ env.LABELLE_CLI_TAG }})
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: ${{ env.LABELLE_CLI_TAG }}
          path: labelle-cli
          persist-credentials: false

      # labelle-gui is NOT version-pinned on purpose: it is checked out only
      # so the labelle-cli build can resolve `flow_codegen` as a relative
      # path-dep (an in-tree sub-package, not its own release train), which
      # is how labelle-cli's own CI does it. It carries no version contract
      # with the lock, so it cannot cause the skew this job hit.
      - name: Checkout labelle-gui for the labelle-cli build
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Cache the cross-compiled bgfx/bx/bimg C++ (the expensive part).
      - name: Cache Zig Android build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            labelle-bgfx/examples/bgfx-android/.labelle/bgfx_android/.zig-cache
          key: bgfx-android-${{ env.LABELLE_CLI_TAG }}-${{ env.LABELLE_ASSEMBLER_TAG }}-${{ hashFiles('labelle-bgfx/examples/bgfx-android/project.labelle', 'labelle-bgfx/build.zig.zon') }}
          restore-keys: |
            bgfx-android-

      - name: Build labelle-assembler
        run: cd labelle-assembler && zig build

      # `-Dversion` is labelle-cli's documented tag-stamp option (its
      # release.yml passes the same thing). Without it the binary inherits
      # build.zig.zon's frozen 1.55.1 and lies about what it is; with it,
      # the stale-CLI guard compares the truth against the lock.
      - name: Build labelle-cli (version-stamped from the pinned tag)
        run: |
          set -euo pipefail
          cd labelle-cli
          zig build -Dversion="${LABELLE_CLI_TAG#v}"
          ./zig-out/bin/labelle version

      - name: Generate + cross-build libgame.so (aarch64-linux-android)
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cd labelle-bgfx/examples/bgfx-android
          $GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle generate --platform=android
          cd .labelle/bgfx_android
          zig build

      - name: Verify libgame.so
        run: |
          set -euo pipefail
          so=$(find labelle-bgfx/examples/bgfx-android/.labelle/bgfx_android -name 'libgame.so' | head -1)
          if [ -z "$so" ]; then echo "libgame.so not found"; exit 1; fi
          echo "found: $so"
          file "$so"
          file "$so" | grep -q 'ELF 64-bit.*ARM aarch64' || { echo "FAIL: not an aarch64 ELF"; exit 1; }
          nm -D "$so" | grep -q 'android_main' || { echo "FAIL: android_main not exported"; exit 1; }
          nm -D "$so" | grep -q 'ANativeActivity_onCreate' || { echo "FAIL: ANativeActivity_onCreate not exported"; exit 1; }

  # Prove the surfaceless render + capture path (labelle-bgfx#36) works with NO
  # display server and NO real GPU — the exact CI scenario `labelle run
  # --headless --screenshot` targets. Runs the on-demand probes on a bare
  # Ubuntu runner using Mesa **lavapipe** (a software Vulkan device) with DISPLAY
  # unset, and asserts each reports OK. `initHeadless` forces Vulkan, which
  # lavapipe provides headless (no VK_KHR_surface / swapchain needed).
  #
  # `surfaceless-scale-probe` (labelle-bgfx#61) is the one that covers SCALE and
  # views this backend does not own. The other three render a tiny fixed scene
  # and were all green while a real game reliably crashed under `initHeadless` —
  # so "surfaceless works" was, until #61, only ever proved for a scene nothing
  # like a game's.
  headless-linux:
    name: surfaceless probes (display-less, lavapipe)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Build deps: bgfx compiles all backends (its GL/X11 code links even when we
      # force Vulkan) and zglfw links X11; input links SDL2. Runtime: the Vulkan
      # loader + the lavapipe software ICD (mesa-vulkan-drivers). vulkan-tools is
      # just for the diagnostic below.
      - name: Install build + Vulkan (lavapipe) deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev \
            libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: bgfx-headless-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            bgfx-headless-${{ runner.os }}-
      - name: Vulkan device summary (lavapipe expected, no display)
        env:
          DISPLAY: ""
        run: vulkaninfo --summary 2>/dev/null | grep -iE 'deviceName|driverName|apiVersion' || true
      - name: Run surfaceless probes with NO display server
        env:
          # Prove it's truly display-less: no X/Wayland available to fall back on.
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
        run: |
          set -uo pipefail
          fail=0
          for step in headless-probe mirror-probe screenshot-probe surfaceless-scale-probe; do
            echo "::group::$step"
            # No `set -e`, so a non-zero build/run doesn't abort the loop — but
            # capture the exit code and FOLD it into `fail` (a probe that printed
            # OK then crashed must still fail the job), alongside the OK-marker
            # check (which catches a build that produced no output at all).
            out=$(zig build "$step" 2>&1); rc=$?
            echo "$out"
            if [ "$rc" -ne 0 ]; then echo "FAIL: $step exited non-zero ($rc)"; fail=1; fi
            echo "$out" | grep -qE 'HEADLESS_OFFSCREEN_READBACK_OK|HEADLESS_MIRROR_OK|SCREENSHOT_TGA_OK|SURFACELESS_SCALE_OK' \
              || { echo "FAIL: $step did not report OK"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
